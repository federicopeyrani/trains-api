spring.application.name=train-apis
server.port=8081
providers.viaggiatreno.concurrency=10
# How long each kind of ViaggiaTreno response is cached (defaults: search, details and region 60m, missing details 10s,
# station lists 24h, station lists failure 5m, departures 10m, train 10m, unknown train 1m)
providers.viaggiatreno.cache.station-search=1m
providers.viaggiatreno.cache.station-details=1m
providers.viaggiatreno.cache.station-details-missing=1m
providers.viaggiatreno.cache.station-region=1m
providers.viaggiatreno.cache.station-registry=1m
providers.viaggiatreno.cache.station-registry-failure=1m
providers.viaggiatreno.cache.departures=1m
providers.viaggiatreno.cache.train=1m
providers.viaggiatreno.cache.train-unknown=1m
# Origins allowed to call the API from a browser (comma-separated patterns), e.g. the debug portal in portal/
api.cors.allowed-origins=*
