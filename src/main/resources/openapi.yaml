openapi: 3.1.0
info:
  title: Train APIs
  description: Train APIs
  version: 1.0.0
servers:
  - url: 'http://localhost:8081'
paths:

  /stations:
    get:
      summary: Search stations by name
      operationId: getStations
      tags: [stations]
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stations whose name matches the query (empty when the query is blank)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StationDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /departures/{from}:
    get:
      summary: Get departures from a station
      operationId: getDepartures
      tags: [trips]
      parameters:
        - name: from
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StationId'
        - name: date
          in: query
          required: false
          description: Departure time to search from, in UTC without offset (e.g. `2026-01-23T21:15:00`). Defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A list of trips departing from the specified station
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
            text/event-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /trips/{from}/{to}:
    get:
      summary: Get trips between two stations
      operationId: getTrips
      tags: [trips]
      parameters:
        - name: from
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StationId'
        - name: to
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StationId'
        - name: date
          in: query
          required: false
          description: Departure time to search from, in UTC without offset (e.g. `2026-01-23T21:15:00`). Defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A list of trips between the specified stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
            text/event-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /trips/all:
    get:
      summary: Get trips between multiple stations
      operationId: getAllTrips
      tags: [trips]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StationId'
        - name: to
          in: query
          required: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StationId'
        - name: date
          in: query
          required: false
          description: Departure time to search from, in UTC without offset (e.g. `2026-01-23T21:15:00`). Defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A list of trips between the specified stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
            text/event-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /runs/{runId}:
    get:
      summary: Get details of a specific run
      operationId: getRun
      tags: [trips]
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RunId'
      responses:
        '200':
          description: Details of the specified run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

components:
  responses:
    BadRequest:
      description: The request is malformed (missing or invalid parameter, invalid run id)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: A requested station or run does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProviderUnavailable:
      description: The data provider cannot serve the request right now (rate limiting, outage); retry later
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      description: RFC 9457 problem details
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Station:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/StationId'
        name:
          type: string
    StationId:
      type: string
    StationDetails:
      allOf:
        - $ref: '#/components/schemas/Station'
        - type: object
          properties:
            location:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  format: float
                longitude:
                  type: number
                  format: float
    Trip:
      type: object
      required:
        - from
        - to
        - lastUpdate
      properties:
        from:
          $ref: '#/components/schemas/OriginStop'
        to:
          $ref: '#/components/schemas/DestinationStop'
        lastUpdate:
          $ref: '#/components/schemas/LastUpdated'
        lastUpdateFromProvider:
          $ref: '#/components/schemas/LastUpdated'
        run:
          $ref: '#/components/schemas/Run'
    Run:
      description: A specific run of a train on a given date. Only one run per train per date exists.
      type: object
      required:
        - id
        - train
        - status
        - origin
        - destination
        - stops
        - lastUpdate
      properties:
        id:
          $ref: '#/components/schemas/RunId'
        train:
          $ref: '#/components/schemas/Train'
        status:
          $ref: '#/components/schemas/Status'
        origin:
          $ref: '#/components/schemas/OriginStop'
        destination:
          $ref: '#/components/schemas/DestinationStop'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/IntermediateStop'
        lastUpdate:
          $ref: '#/components/schemas/LastUpdated'
        lastUpdateFromProvider:
          $ref: '#/components/schemas/LastUpdated'
    RunId:
      type: string
    Timing:
      description: Times of an event. Like every date-time of this API, they are in UTC and carry no offset (e.g. `2026-01-23T21:15`).
      type: object
      required:
        - scheduled
      properties:
        scheduled:
          type: string
          format: date-time
        expected:
          type: string
          format: date-time
        actual:
          type: string
          format: date-time
    Stop:
      oneOf:
        - $ref: '#/components/schemas/OriginStop'
        - $ref: '#/components/schemas/DestinationStop'
        - $ref: '#/components/schemas/IntermediateStop'
    BaseStop:
      type: object
      required:
        - station
      properties:
        station:
          $ref: '#/components/schemas/Station'
        status:
          $ref: '#/components/schemas/StopStatus'
    OriginStop:
      allOf:
        - $ref: "#/components/schemas/BaseStop"
        - type: object
          properties:
            departureTime:
              $ref: '#/components/schemas/Timing'
    DestinationStop:
      allOf:
        - $ref: "#/components/schemas/BaseStop"
        - type: object
          properties:
            arrivalTime:
              $ref: '#/components/schemas/Timing'
    IntermediateStop:
      allOf:
        - $ref: "#/components/schemas/BaseStop"
        - type: object
          properties:
            arrivalTime:
              $ref: '#/components/schemas/Timing'
            departureTime:
              $ref: '#/components/schemas/Timing'
    StopStatus:
      type: string
      enum:
        - NOT_YET_ARRIVED
        - ARRIVED
        - DEPARTED
        - NOT_YET_DEPARTED
    Status:
      type: string
      enum:
        - ON_TIME
        - DELAYED
        - CANCELLED
    LastUpdated:
      description: When the data was last refreshed, in UTC without offset.
      type: string
      format: date-time
    Train:
      description: Information about a specific train. The same train ID can be used across different runs.
      type: object
      required:
        - id
        - origin
        - destination
      properties:
        id:
          $ref: '#/components/schemas/TrainId'
        origin:
          $ref: '#/components/schemas/Station'
        destination:
          $ref: '#/components/schemas/Station'
    TrainId:
      type: string

