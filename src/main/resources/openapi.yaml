openapi: 3.1.0
info:
  title: Train APIs
  description: Train APIs
  version: 1.0.0
servers:
  - url: 'http://localhost:8081'
paths:

  /stations:
    get:
      summary: Search stations by name
      operationId: getStations
      tags: [stations]
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stations whose name matches the query (empty when the query is blank)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StationDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /departures/{from}:
    get:
      summary: Get departures from a station
      operationId: getDepartures
      tags: [trips]
      parameters:
        - name: from
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StationId'
        - name: date
          in: query
          required: false
          description: |
            Departure time to search from, as an RFC 3339 date-time (e.g. `2026-01-23T21:15:00Z` or `2026-01-23T22:15:00+01:00`). A date-time without offset is read as UTC. Defaults to now.

            Results come from the provider's live departure board around that time: trains scheduled from about 15
            minutes before to about 105 minutes after it, minus those that left the station a while ago. Earlier times
            give few or no results, and the provider only tracks today's trains, so on other days trips have no run.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: |
            Trips departing from the specified station. As `application/json`, sorted by scheduled departure; as
            `text/event-stream`, each trip is sent as soon as it is known, in no particular order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
            text/event-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /trips/{from}/{to}:
    get:
      summary: Get trips between two stations
      operationId: getTrips
      tags: [trips]
      parameters:
        - name: from
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StationId'
        - name: to
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StationId'
        - name: date
          in: query
          required: false
          description: |
            Departure time to search from, as an RFC 3339 date-time (e.g. `2026-01-23T21:15:00Z` or `2026-01-23T22:15:00+01:00`). A date-time without offset is read as UTC. Defaults to now.

            Results come from the provider's live departure board around that time: trains scheduled from about 15
            minutes before to about 105 minutes after it, minus those that left the station a while ago. Earlier times
            give few or no results, and the provider only tracks today's trains, so on other days trips have no run.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: |
            Trips between the specified stations, sorted by scheduled departure. Departures whose run could not be
            checked are left out and only counted in `unverifiedDepartures`: when it is not 0, some of them may also
            reach the destination.

            As `text/event-stream`, every trip is sent as soon as it is known (in no particular order) as an unnamed
            event with a `Trip` as data, followed by one final
            `summary` event whose data is a `TripSearchSummary`. A stream without the `summary` event is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSearch'
            text/event-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /trips/all:
    get:
      summary: Get trips between multiple stations
      operationId: getAllTrips
      tags: [trips]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StationId'
        - name: to
          in: query
          required: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StationId'
        - name: date
          in: query
          required: false
          description: |
            Departure time to search from, as an RFC 3339 date-time (e.g. `2026-01-23T21:15:00Z` or `2026-01-23T22:15:00+01:00`). A date-time without offset is read as UTC. Defaults to now.

            Results come from the provider's live departure board around that time: trains scheduled from about 15
            minutes before to about 105 minutes after it, minus those that left the station a while ago. Earlier times
            give few or no results, and the provider only tracks today's trains, so on other days trips have no run.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: |
            Trips between the specified stations, sorted by scheduled departure. Departures whose run could not be
            checked are left out and only counted in `unverifiedDepartures`: when it is not 0, some of them may also
            reach the destination.

            As `text/event-stream`, every trip is sent as soon as it is known (in no particular order) as an unnamed
            event with a `Trip` as data, followed by one final
            `summary` event whose data is a `TripSearchSummary`. A stream without the `summary` event is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSearch'
            text/event-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /runs/{runId}:
    get:
      summary: Get details of a specific run
      operationId: getRun
      tags: [trips]
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RunId'
      responses:
        '200':
          description: Details of the specified run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

components:
  responses:
    BadRequest:
      description: The request is malformed (missing or invalid parameter, invalid run id)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: A requested station or run does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProviderUnavailable:
      description: The data provider cannot serve the request right now (rate limiting, outage); retry later
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      description: RFC 9457 problem details
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Station:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/StationId'
        name:
          type: string
    StationId:
      type: string
    StationDetails:
      allOf:
        - $ref: '#/components/schemas/Station'
        - type: object
          properties:
            location:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  format: float
                longitude:
                  type: number
                  format: float
    Trip:
      type: object
      required:
        - from
        - to
        - lastUpdate
      properties:
        from:
          $ref: '#/components/schemas/OriginStop'
        to:
          $ref: '#/components/schemas/DestinationStop'
        lastUpdate:
          $ref: '#/components/schemas/LastUpdated'
        lastUpdateFromProvider:
          description: When the provider last detected the train's position. Absent before departure.
          $ref: '#/components/schemas/LastUpdated'
        run:
          $ref: '#/components/schemas/Run'
    TripSearchSummary:
      type: object
      required:
        - unverifiedDepartures
      properties:
        unverifiedDepartures:
          description: |
            Departures from the origin stations that might reach a destination but could not be checked (their run
            could not be fetched). They are not part of the trips; when not 0, the result is incomplete.
          type: integer
          minimum: 0
    TripSearch:
      allOf:
        - $ref: '#/components/schemas/TripSearchSummary'
        - type: object
          required:
            - trips
          properties:
            trips:
              type: array
              items:
                $ref: '#/components/schemas/Trip'
    Run:
      description: A specific run of a train on a given date. Only one run per train per date exists.
      type: object
      required:
        - id
        - train
        - status
        - tracking
        - origin
        - destination
        - stops
        - lastUpdate
      properties:
        id:
          $ref: '#/components/schemas/RunId'
        train:
          $ref: '#/components/schemas/Train'
        status:
          $ref: '#/components/schemas/Status'
        tracking:
          $ref: '#/components/schemas/Tracking'
        origin:
          $ref: '#/components/schemas/OriginStop'
        destination:
          $ref: '#/components/schemas/DestinationStop'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/IntermediateStop'
        lastUpdate:
          $ref: '#/components/schemas/LastUpdated'
    RunId:
      type: string
    Tracking:
      description: How well the provider is following the train, as of the run's `lastUpdate`.
      type: object
      required:
        - state
      properties:
        state:
          $ref: '#/components/schemas/TrackingState'
        lastDetection:
          description: |
            When the provider last detected the train's position. Always present when `state` is `LIVE` or `STALE`, never
            when it is `PENDING` or `MISSING`.
          type: string
          format: date-time
    TrackingState:
      description: |
        - `LIVE`: the train has been detected recently.
        - `STALE`: the train has been detected, but not recently: its times and statuses may be behind.
        - `PENDING`: the train has not been detected, which is still normal (e.g. before its departure).
        - `MISSING`: the train has not been detected although it should have been by now: statuses such as
          `NOT_YET_DEPARTED` and the run's `status` cannot be relied on.
        - `NOT_TRACKED`: there is nothing left to follow, as the train has arrived or is cancelled.

        The provider decides what counts as recent or normal.
      type: string
      enum:
        - LIVE
        - STALE
        - PENDING
        - MISSING
        - NOT_TRACKED
    Timing:
      description: Times of an event. Like every date-time of this API, they are RFC 3339 instants in UTC (e.g. `2026-01-23T21:15:00Z`).
      type: object
      required:
        - scheduled
      properties:
        scheduled:
          type: string
          format: date-time
        expected:
          type: string
          format: date-time
        actual:
          type: string
          format: date-time
    Stop:
      oneOf:
        - $ref: '#/components/schemas/OriginStop'
        - $ref: '#/components/schemas/DestinationStop'
        - $ref: '#/components/schemas/IntermediateStop'
    BaseStop:
      type: object
      required:
        - station
      properties:
        station:
          $ref: '#/components/schemas/Station'
        status:
          $ref: '#/components/schemas/StopStatus'
    OriginStop:
      allOf:
        - $ref: "#/components/schemas/BaseStop"
        - type: object
          properties:
            departureTime:
              $ref: '#/components/schemas/Timing'
    DestinationStop:
      allOf:
        - $ref: "#/components/schemas/BaseStop"
        - type: object
          properties:
            arrivalTime:
              $ref: '#/components/schemas/Timing'
    IntermediateStop:
      allOf:
        - $ref: "#/components/schemas/BaseStop"
        - type: object
          properties:
            arrivalTime:
              $ref: '#/components/schemas/Timing'
            departureTime:
              $ref: '#/components/schemas/Timing'
    StopStatus:
      type: string
      enum:
        - NOT_YET_ARRIVED
        - ARRIVED
        - DEPARTED
        - NOT_YET_DEPARTED
        - CANCELLED
    Status:
      type: string
      enum:
        - ON_TIME
        - DELAYED
        - CANCELLED
    LastUpdated:
      description: When the data was last refreshed.
      type: string
      format: date-time
    Train:
      description: Information about a specific train. The same train ID can be used across different runs.
      type: object
      required:
        - id
        - origin
        - destination
      properties:
        id:
          $ref: '#/components/schemas/TrainId'
        origin:
          $ref: '#/components/schemas/Station'
        destination:
          $ref: '#/components/schemas/Station'
    TrainId:
      type: string

