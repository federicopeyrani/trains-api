openapi: 3.1.0
info:
  title: Train APIs
  description: Train APIs
  version: 1.0.0
servers:
  - url: 'http://localhost:8081'
paths:

  /departures/{from}:
    get:
      summary: Get departures from a station
      operationId: getDepartures
      parameters:
        - name: from
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StationId'
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A list of trips departing from the specified station
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'

  /trips/{from}/{to}:
    get:
      summary: Get trips between two stations
      operationId: getTrips
      parameters:
        - name: from
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StationId'
        - name: to
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StationId'
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A list of trips between the specified stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'

  /runs/{runId}:
    get:
      summary: Get details of a specific run
      operationId: getRun
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RunId'
      responses:
        '200':
          description: Details of the specified run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
components:
  schemas:
    Station:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/StationId'
        name:
          type: string
    StationId:
      type: string
    Trip:
      type: object
      required:
        - from
        - to
        - status
        - lastUpdate
      properties:
        from:
          $ref: '#/components/schemas/Station'
        to:
          $ref: '#/components/schemas/Station'
        departureTime:
          $ref: '#/components/schemas/Timing'
        arrivalTime:
          $ref: '#/components/schemas/Timing'
        lastUpdate:
          $ref: '#/components/schemas/LastUpdated'
        lastUpdateFromProvider:
          $ref: '#/components/schemas/LastUpdated'
        run:
          $ref: '#/components/schemas/Run'
    Run:
      description: A specific run of a train on a given date. Only one run per train per date exists.
      type: object
      required:
        - id
        - originDepartureTime
        - destinationArrivalTime
        - train
        - status
        - lastUpdate
      properties:
        id:
          $ref: '#/components/schemas/RunId'
        originDepartureTime:
          $ref: '#/components/schemas/Timing'
        destinationArrivalTime:
          $ref: '#/components/schemas/Timing'
        train:
          $ref: '#/components/schemas/Train'
        status:
          $ref: '#/components/schemas/Status'
        lastUpdate:
          $ref: '#/components/schemas/LastUpdated'
        lastUpdateFromProvider:
          $ref: '#/components/schemas/LastUpdated'
    RunId:
      type: string
    Timing:
      type: object
      required:
        - scheduled
      properties:
        scheduled:
          type: string
          format: date-time
        expected:
          type: string
          format: date-time
        actual:
          type: string
          format: date-time
    Status:
      type: string
      enum:
        - on-time
        - delayed
        - cancelled
    LastUpdated:
      type: string
      format: date-time
    Train:
      description: Information about a specific train. The same train ID can be used across different runs.
      type: object
      required:
        - id
        - origin
        - destination
      properties:
        id:
          $ref: '#/components/schemas/TrainId'
        origin:
          $ref: '#/components/schemas/Station'
        destination:
          $ref: '#/components/schemas/Station'
    TrainId:
      type: string
