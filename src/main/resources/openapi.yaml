openapi: 3.1.0
info:
  title: Train APIs
  description: Train APIs
  version: 1.0.0
servers:
  - url: 'http://localhost:8081'
paths:

  /stations:
    get:
      summary: Get all stations
      operationId: getStations
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of all stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StationDetails'

  /departures/{from}:
    get:
      summary: Get departures from a station
      operationId: getDepartures
      parameters:
        - name: from
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StationId'
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A list of trips departing from the specified station
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
            text/event-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'

  /trips/{from}/{to}:
    get:
      summary: Get trips between two stations
      operationId: getTrips
      parameters:
        - name: from
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StationId'
        - name: to
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StationId'
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A list of trips between the specified stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
            text/event-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'

  /trips/all:
    get:
      summary: Get trips between multiple stations
      operationId: getAllTrips
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StationId'
        - name: to
          in: query
          required: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StationId'
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A list of trips between the specified stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
            text/event-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'

  /runs/{runId}:
    get:
      summary: Get details of a specific run
      operationId: getRun
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RunId'
      responses:
        '200':
          description: Details of the specified run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
components:
  schemas:
    Station:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/StationId'
        name:
          type: string
    StationId:
      type: string
    StationDetails:
      allOf:
        - $ref: '#/components/schemas/Station'
        - type: object
          properties:
            location:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  format: float
                longitude:
                  type: number
                  format: float
    Trip:
      type: object
      required:
        - from
        - to
        - status
        - lastUpdate
      properties:
        from:
          oneOf:
            - $ref: '#/components/schemas/IntermediateStop'
            - $ref: '#/components/schemas/OriginStop'
        to:
          oneOf:
            - $ref: '#/components/schemas/IntermediateStop'
            - $ref: '#/components/schemas/DestinationStop'
        lastUpdate:
          $ref: '#/components/schemas/LastUpdated'
        lastUpdateFromProvider:
          $ref: '#/components/schemas/LastUpdated'
        run:
          $ref: '#/components/schemas/Run'
    Run:
      description: A specific run of a train on a given date. Only one run per train per date exists.
      type: object
      required:
        - id
        - originDepartureTime
        - destinationArrivalTime
        - train
        - status
        - origin
        - destination
        - stops
        - lastUpdate
      properties:
        id:
          $ref: '#/components/schemas/RunId'
        train:
          $ref: '#/components/schemas/Train'
        status:
          $ref: '#/components/schemas/Status'
        origin:
          $ref: '#/components/schemas/OriginStop'
        destination:
          $ref: '#/components/schemas/DestinationStop'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/IntermediateStop'
        lastUpdate:
          $ref: '#/components/schemas/LastUpdated'
        lastUpdateFromProvider:
          $ref: '#/components/schemas/LastUpdated'
    RunId:
      type: string
    Timing:
      type: object
      required:
        - scheduled
      properties:
        scheduled:
          type: string
          format: date-time
        expected:
          type: string
          format: date-time
        actual:
          type: string
          format: date-time
    Stop:
      oneOf:
        - $ref: '#/components/schemas/OriginStop'
        - $ref: '#/components/schemas/DestinationStop'
        - $ref: '#/components/schemas/IntermediateStop'
    BaseStop:
      type: object
      required:
        - station
      properties:
        station:
          $ref: '#/components/schemas/Station'
        status:
          $ref: '#/components/schemas/StopStatus'
    OriginStop:
      allOf:
        - $ref: "#/components/schemas/BaseStop"
        - type: object
          properties:
            departureTime:
              $ref: '#/components/schemas/Timing'
    DestinationStop:
      allOf:
        - $ref: "#/components/schemas/BaseStop"
        - type: object
          properties:
            arrivalTime:
              $ref: '#/components/schemas/Timing'
    IntermediateStop:
      allOf:
        - $ref: "#/components/schemas/BaseStop"
        - type: object
          properties:
            arrivalTime:
              $ref: '#/components/schemas/Timing'
            departureTime:
              $ref: '#/components/schemas/Timing'
    StopStatus:
      type: string
      enum:
        - NOT_YET_ARRIVED
        - ARRIVED
        - DEPARTED
        - NOT_YET_DEPARTED
    Status:
      type: string
      enum:
        - ON_TIME
        - DELAYED
        - CANCELLED
    LastUpdated:
      type: string
      format: date-time
    Train:
      description: Information about a specific train. The same train ID can be used across different runs.
      type: object
      required:
        - id
        - origin
        - destination
      properties:
        id:
          $ref: '#/components/schemas/TrainId'
        origin:
          $ref: '#/components/schemas/Station'
        destination:
          $ref: '#/components/schemas/Station'
    TrainId:
      type: string

